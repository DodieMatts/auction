services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - auction_production_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - auction_internal
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auction_internal
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      HOST: ${HOST:?HOST is required}
      PORT: ${PORT:?PORT is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_ISSUER: ${JWT_ISSUER:-auction-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-auction-web}
      ALLOWED_APP_ORIGIN: ${ALLOWED_APP_ORIGIN:?ALLOWED_APP_ORIGIN is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - auction_internal
    restart: unless-stopped
    init: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - auction_internal
    restart: unless-stopped
    init: true

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - target: 8080
        published: "8080"
        host_ip: "127.0.0.1"
        protocol: tcp
    depends_on:
      web:
        condition: service_healthy
    networks:
      - auction_internal
      - auction_edge
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    init: true

networks:
  auction_internal:
    internal: true

  auction_edge:
    driver: bridge

volumes:
  auction_production_data:
